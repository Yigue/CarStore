version: "2"
type: backend
tech_stack:
  - C#
  - ASP.NET Core 8
  - Entity Framework Core
  - PostgreSQL
  - MediatR (CQRS)
  - FluentValidation
features:
  - name: Inventory Management API
    description: CRUD operations for vehicles and images
    files:
      - src/Web.Api/Endpoints/Cars/Create.cs
      - src/Web.Api/Endpoints/Cars/Update.cs
      - src/Web.Api/Endpoints/Cars/GetById.cs
      - src/Web.Api/Endpoints/Cars/Delete.cs
    endpoints:
      - method: GET
        path: /api/v1/cars
        description: List all vehicles
        auth_required: true
        response_schema:
          "200": PaginatedResult<CarResponse>
      - method: POST
        path: /api/v1/cars
        description: Create a new vehicle
        auth_required: true
        request_schema:
          body:
            marca: string
            modelo: string
            patente: string
        response_schema:
          "200": string (Guid)
          "400": Validation error
      - method: PUT
        path: /api/v1/cars/{id}
        description: Update a vehicle
        auth_required: true
        request_schema:
          body:
            marca: string
            modelo: string
        response_schema:
          "204": NoContent
          "400": Validation error
          "404": NotFound
  - name: CRM API
    description: Management of Clients and Leads
    files:
      - src/Web.Api/Endpoints/Clients/Create.cs
      - src/Web.Api/Endpoints/Leads/Create.cs
    endpoints:
      - method: GET
        path: /api/v1/clients
        description: List clients
        auth_required: true
        response_schema:
          "200": PaginatedResult<ClientResponse>
      - method: POST
        path: /api/v1/clients
        description: Create a client
        auth_required: true
        request_schema:
          body:
            firstName: string
            lastName: string
        response_schema:
          "200": string (Guid)
  - name: Finance API
    description: Management of Financial Transactions
    files:
      - src/Web.Api/Endpoints/Financial/Create.cs
    endpoints:
      - method: POST
        path: /api/v1/financial
        description: Create a financial transaction
        auth_required: true
        request_schema:
          body:
            amount: number
            type: string
        response_schema:
          "200": string (Guid)
known_limitations: []
